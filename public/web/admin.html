<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ここから。管理画面</title>
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <div class="layout">
    <aside class="left">
      <div class="head">利用者一覧</div>
      <input id="userSearch" placeholder="検索">
      <button id="refreshDisplayName" type="button">選択ユーザーのLINE名更新</button>
      <div id="userList"></div>
    </aside>
    <main class="center">
      <div class="head">チャット履歴</div>
      <div class="chat-tools">
        <input id="chatSearch" placeholder="この履歴を検索">
        <button id="chatSearchBtn" type="button">検索</button>
        <button id="loadOlder" type="button">もっと前を読む</button>
      </div>
      <div id="chatHistory"></div>
      <form id="sendForm" class="send">
        <textarea id="messageInput" placeholder="返信を入力"></textarea>
        <input id="fileInput" type="file" multiple accept=".jpg,.jpeg,.png,.webp,.mp4,.mov">
        <button id="sendBtn" type="submit">送信</button>
      </form>
    </main>
    <aside class="right">
      <div class="head">AI相談 / 下書き</div>
      <div class="right-split">
        <section class="consult">
          <div class="section-head">AI相談（管理者向け）</div>
          <div class="tabs">
            <button data-tab="today" class="active">今日</button>
            <button data-tab="week">今週</button>
            <button data-tab="month">今月</button>
          </div>
          <div id="panelToday" class="panel active"></div>
          <div id="panelWeek" class="panel"></div>
          <div id="panelMonth" class="panel"></div>
          <div id="consultLog" class="consult-log"></div>
          <form id="consultForm" class="consult-form">
            <select id="consultType">
              <option value="weekly">週間報告向け</option>
              <option value="monthly">月間報告向け</option>
            </select>
            <textarea id="consultInput" placeholder="例: 今週の声かけを3案出して"></textarea>
            <div class="row-btns">
              <button type="submit">AIに相談</button>
              <button id="applyToWeek" type="button">回答を週報へ反映</button>
              <button id="applyToMonth" type="button">回答を月報へ反映</button>
            </div>
          </form>
        </section>
        <section class="drafts">
          <div class="section-head">下書き保存</div>
          <div class="tabs">
            <button data-tab="weekDraft" class="active">週間報告下書き</button>
            <button data-tab="monthDraft">月間報告下書き</button>
          </div>
          <div id="panelWeekDraft" class="panel active">
            <button id="genWeek">再生成</button>
            <button id="reloadWeek">再読込</button>
            <textarea id="weekDraftText"></textarea>
            <div id="weekDraftUpdated"></div>
            <button id="saveWeek">保存</button>
          </div>
          <div id="panelMonthDraft" class="panel">
            <button id="genMonth">再生成</button>
            <button id="reloadMonth">再読込</button>
            <textarea id="monthDraftText"></textarea>
            <div id="monthDraftUpdated"></div>
            <button id="saveMonth">保存</button>
          </div>
        </section>
      </div>
      <div class="theme">
        <label>テーマ</label>
        <select id="themeId">
          <option value="soft-default">soft-default</option>
          <option value="clear-cream">clear-cream</option>
          <option value="clear-blue">clear-blue</option>
          <option value="night-gentle">night-gentle</option>
        </select>
        <button id="saveTheme">テーマ保存</button>
      </div>
      <div id="status"></div>
    </aside>
  </div>
  <script src="./admin.js"></script>
</body>
</html>
